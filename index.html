<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록 자동 생성</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0f11;
  --bg2: #18181c;
  --bg3: #222228;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.15);
  --text: #f0eff5;
  --text2: #9896a4;
  --text3: #5c5b66;
  --accent: #6c63ff;
  --accent-dim: rgba(108,99,255,0.15);
  --accent-glow: rgba(108,99,255,0.3);
  --red: #ff4f4f;
  --red-dim: rgba(255,79,79,0.12);
  --green: #3ddc97;
  --green-dim: rgba(61,220,151,0.12);
  --amber: #f5a623;
  --amber-dim: rgba(245,166,35,0.12);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
}
.header-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
  flex-shrink: 0;
}
.header h1 { font-size: 15px; font-weight: 500; }
.header-sub { margin-left: auto; font-size: 12px; color: var(--text3); }

/* ── Layout ── */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 380px 1fr;
}

/* ── Left panel ── */
.left {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 28px 24px;
  gap: 24px;
  overflow-y: auto;
  height: calc(100vh - 53px);
  position: sticky;
  top: 53px;
}

.label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 8px;
}

/* ── Recorder ── */
.record-btn-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin-top: 30px;
}
.record-btn {
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--bg2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  position: relative;
  outline: none;
}
.record-btn::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  transition: border-color 0.2s;
}
.record-btn.idle:hover { background: var(--bg3); }
.record-btn.recording {
  background: var(--red-dim);
  border-color: var(--red);
  animation: pulse-ring 1.5s ease-in-out infinite;
}
.record-btn.recording::before { border-color: rgba(255,79,79,0.3); }
@keyframes pulse-ring {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,79,79,0.2); }
  50% { box-shadow: 0 0 0 10px rgba(255,79,79,0); }
}
.record-icon {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--red);
  transition: all 0.2s;
}
.record-btn.recording .record-icon { border-radius: 4px; }
.record-status { font-size: 13px; color: var(--text2); text-align: center; }
.record-status.recording { color: var(--red); }
.timer { font-size: 26px; font-weight: 300; letter-spacing: 0.08em; font-family: 'SF Mono', monospace; font-variant-numeric: tabular-nums; }
.timer.hidden { display: none; }

/* Waveform */
.waveform {
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  opacity: 0;
  transition: opacity 0.3s;
}
.waveform.active { opacity: 1; }
.wave-bar { width: 3px; border-radius: 2px; background: var(--red); height: 4px; transition: height 0.1s ease; }

/* Save recording button */
.save-rec-btn {
  display: none;
  width: 100%;
  padding: 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  gap: 6px;
  align-items: center;
  justify-content: center;
}
.save-rec-btn.show { display: flex; }
.save-rec-btn:hover { border-color: var(--green); color: var(--green); }

/* Divider */
.divider-row {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text3);
  font-size: 12px;
}
.divider-line { flex: 1; height: 1px; background: var(--border); }

/* Upload */
.upload-area {
  border: 1.5px dashed var(--border);
  border-radius: 10px;
  padding: 18px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.upload-area:hover, .upload-area.dragover {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.upload-area input { display: none; }
.upload-icon { font-size: 18px; margin-bottom: 5px; opacity: 0.5; }
.upload-text { font-size: 13px; color: var(--text2); }
.upload-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

.file-info {
  display: none;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text2);
  gap: 8px;
  align-items: center;
}
.file-info.show { display: flex; }
.file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.file-remove { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 16px; padding: 0; transition: color 0.2s; }
.file-remove:hover { color: var(--red); }

/* Generate btn */
.generate-btn {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.generate-btn:hover { background: #7b74ff; }
.generate-btn:disabled { background: var(--bg3); color: var(--text3); cursor: not-allowed; }

/* ── Right panel ── */
.right {
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 53px);
}

/* Empty */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--text3);
  padding: 40px;
}
.empty-icon {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-bottom: 4px;
}
.empty-state h2 { font-size: 15px; font-weight: 500; color: var(--text2); }
.empty-state p { font-size: 13px; text-align: center; line-height: 1.6; max-width: 220px; }

/* Loading */
.loading-state {
  flex: 1;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 40px;
}
.loading-state.show { display: flex; }
.loading-ring {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text2); }
.loading-sub { font-size: 12px; color: var(--text3); }

/* Result */
.result-panel { display: none; flex-direction: column; }
.result-panel.show { display: flex; }

.result-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 53px;
  background: var(--bg);
  z-index: 5;
}
.result-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--green-dim);
  border: 1px solid rgba(61,220,151,0.2);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px;
  color: var(--green);
  margin-bottom: 6px;
  font-weight: 500;
}
.result-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
.result-title { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3; }
.result-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }

/* Detail level tabs */
.detail-tabs {
  display: flex;
  gap: 6px;
  margin-top: 14px;
}
.detail-tab {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  transition: all 0.2s;
}
.detail-tab:hover { border-color: var(--border-hover); color: var(--text2); }
.detail-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* Header actions */
.result-header-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.result-title-wrap { flex: 1; }
.header-actions { display: flex; gap: 6px; flex-shrink: 0; }
.action-btn {
  padding: 7px 12px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text2);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.action-btn:hover { border-color: var(--border-hover); color: var(--text); }

/* Result body */
.result-body {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Sections */
.section { display: flex; flex-direction: column; gap: 10px; }
.section-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.summary-text {
  font-size: 14px;
  line-height: 1.75;
  color: var(--text2);
  background: var(--bg2);
  border-left: 2px solid var(--accent);
  padding: 14px 16px;
  border-radius: 0 8px 8px 0;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid; }
.chip-person { background: var(--accent-dim); border-color: rgba(108,99,255,0.25); color: #a09bff; }
.chip-agenda { background: var(--amber-dim); border-color: rgba(245,166,35,0.25); color: var(--amber); }

.discussion-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  transition: border-color 0.2s;
}
.discussion-item:hover { border-color: var(--border-hover); }
.discussion-topic { font-size: 13px; font-weight: 600; color: var(--text); }
.discussion-content { font-size: 13px; color: var(--text2); line-height: 1.65; }

.action-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 13px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: border-color 0.2s;
}
.action-item:hover { border-color: var(--border-hover); }
.action-check { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--border-hover); flex-shrink: 0; margin-top: 1px; }
.action-text { flex: 1; font-size: 13px; color: var(--text); line-height: 1.5; }
.action-owner { font-size: 11px; background: var(--accent-dim); color: #a09bff; border: 1px solid rgba(108,99,255,0.2); border-radius: 4px; padding: 2px 7px; white-space: nowrap; flex-shrink: 0; }
.action-due { font-size: 11px; color: var(--text3); margin-top: 2px; }

.decision-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  padding: 10px 13px;
  background: var(--green-dim);
  border: 1px solid rgba(61,220,151,0.15);
  border-radius: 8px;
}
.decision-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; margin-top: 5px; }

/* Brief version */
.brief-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.brief-title { font-size: 16px; font-weight: 600; color: var(--text); }
.brief-summary { font-size: 14px; color: var(--text2); line-height: 1.7; }
.brief-row { display: flex; flex-direction: column; gap: 6px; }
.brief-row-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
.brief-item { font-size: 13px; color: var(--text2); padding: 6px 10px; background: var(--bg3); border-radius: 6px; }

/* 녹음 모드 탭 */
.rec-tabs {
  display: flex;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.rec-tab {
  flex: 1;
  padding: 7px 0;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.rec-tab:hover { color: var(--text2); }
.rec-tab.active {
  background: var(--bg3);
  color: var(--text);
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.rec-tab-icon { font-size: 13px; }
.mode-notice {
  font-size: 11px;
  color: var(--text3);
  text-align: center;
  line-height: 1.6;
  padding: 9px 12px;
  background: var(--bg2);
  border-radius: 7px;
  border: 1px solid var(--border);
  display: none;
  margin-top: 4px;
}
.mode-notice.show { display: block; }

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 16px;
  font-size: 13px;
  color: var(--text);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  opacity: 0;
  transition: all 0.3s;
  z-index: 100;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ── Mobile ── */
@media (max-width: 720px) {
  .main {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
  }
  .left {
    height: auto;
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 20px 16px;
    gap: 20px;
  }
  .right { min-height: auto; }
  .result-header { position: static; padding: 16px; }
  .result-header-top { flex-wrap: wrap; }
  .header-actions { width: 100%; justify-content: flex-end; }
  .detail-tabs { flex-wrap: wrap; }
  .result-body { padding: 16px; gap: 16px; }
  .empty-state { padding: 40px 20px; min-height: 200px; }
  .loading-state { padding: 40px 20px; min-height: 200px; }
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-dot"></div>
  <h1>회의록 자동 생성</h1>
  <span class="header-sub">Gemini 2.5 Flash</span>
</div>

<div class="main">
  <!-- Left -->
  <div class="left">

    <!-- 녹음 -->
    <div style="display:flex;flex-direction:column;gap:14px;">
      <span class="label">녹음</span>

      <!-- 모드 탭 -->
      <div class="rec-tabs">
        <button class="rec-tab active" id="recTab-mic" onclick="switchRecTab('mic')">
          <span class="rec-tab-icon">🎙</span> 마이크
        </button>
        <button class="rec-tab" id="recTab-system" onclick="switchRecTab('system')">
          <span class="rec-tab-icon">🖥</span> 시스템 오디오
        </button>
      </div>

      <!-- 안내 문구 (시스템 탭 선택 시) -->
      <div class="mode-notice" id="onlineNotice">
        팝업에서 <b style="color:var(--text)">탭</b> 또는 <b style="color:var(--text)">전체 화면</b> 선택 후<br>
        <b style="color:var(--green)">✓ 오디오 공유</b> 체크박스를 반드시 클릭하세요
      </div>

      <!-- 공통 녹음 버튼 -->
      <div class="record-btn-wrap">
        <div class="timer hidden" id="timer">00:00</div>
        <button class="record-btn idle" id="recordBtn" onclick="toggleRecord()">
          <div class="record-icon"></div>
        </button>
        <span class="record-status" id="recordStatus">클릭하여 녹음 시작</span>
      </div>
      <div class="waveform" id="waveform"></div>

      <!-- 저장 버튼 -->
      <button class="save-rec-btn" id="saveRecBtn" onclick="saveRecording()">
        ⬇ 녹음 파일 저장
      </button>
    </div>

    <!-- 구분선 -->
    <div class="divider-row">
      <div class="divider-line"></div>
      <span>또는</span>
      <div class="divider-line"></div>
    </div>

    <!-- 업로드 -->
    <div>
      <span class="label">파일 업로드</span>
      <div class="upload-area" id="uploadArea"
        onclick="document.getElementById('fileInput').click()"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event)">
        <input type="file" id="fileInput" accept="audio/*,video/*" onchange="onFileSelect(event)">
        <div class="upload-icon">🎙</div>
        <div class="upload-text">파일을 드래그하거나 클릭</div>
        <div class="upload-sub">.m4a .mp3 .wav .mp4</div>
      </div>
      <div class="file-info" id="fileInfo">
        <span>🎵</span>
        <span class="file-name" id="fileName"></span>
        <button class="file-remove" onclick="removeFile()">✕</button>
      </div>
    </div>

    <!-- 생성 버튼 -->
    <button class="generate-btn" id="generateBtn" onclick="generate()" disabled>
      회의록 생성
    </button>

  </div>

  <!-- Right -->
  <div class="right">

    <!-- Empty -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📋</div>
      <h2>회의록이 여기에 표시됩니다</h2>
      <p>녹음하거나 파일을 업로드한 후 회의록 생성을 눌러주세요</p>
    </div>

    <!-- Loading -->
    <div class="loading-state" id="loadingState">
      <div class="loading-ring"></div>
      <div class="loading-text">Gemini가 분석 중입니다</div>
      <div class="loading-sub" id="loadingSub">오디오 변환 중...</div>
    </div>

    <!-- Result -->
    <div class="result-panel" id="resultPanel">
      <div class="result-header">
        <div class="result-header-top">
          <div class="result-title-wrap">
            <div class="result-badge"><div class="result-badge-dot"></div>생성 완료</div>
            <div class="result-title" id="resultTitle">회의록</div>
            <div class="result-meta" id="resultMeta"></div>
          </div>
          <div class="header-actions">
            <button class="action-btn" onclick="copyMarkdown()">📋 복사</button>
          </div>
        </div>
        <!-- 상세 레벨 탭 -->
        <div class="detail-tabs">
          <button class="detail-tab" id="tab-brief" onclick="switchTab('brief')">간략</button>
          <button class="detail-tab active" id="tab-medium" onclick="switchTab('medium')">중간</button>
          <button class="detail-tab" id="tab-detail" onclick="switchTab('detail')">상세</button>
        </div>
      </div>
      <div class="result-body" id="resultBody"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GEMINI_API_KEY = 'AQ.Ab8RN6LUAIMBhKezKJTZDSfqnfG8VUwuWb8ZrWbu2eFn1vI7aw';

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let timerInterval = null;
let seconds = 0;
let recordedBlob = null;
let uploadedFile = null;
let animFrame = null;
let analyser = null;
let dataArray = null;
let lastMinutes = null;
let currentTab = 'medium';
let recMode = 'mic'; // 'mic' | 'system'

// ── Waveform ─────────────────────────────
const waveform = document.getElementById('waveform');
for (let i = 0; i < 28; i++) {
  const b = document.createElement('div');
  b.className = 'wave-bar';
  waveform.appendChild(b);
}
const bars = waveform.querySelectorAll('.wave-bar');

function animateWave() {
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  const step = Math.floor(dataArray.length / bars.length);
  bars.forEach((bar, i) => {
    const val = dataArray[i * step] || 0;
    bar.style.height = Math.max(4, (val / 255) * 38) + 'px';
  });
  animFrame = requestAnimationFrame(animateWave);
}

// ── Timer ────────────────────────────────
function startTimer() {
  seconds = 0;
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    document.getElementById('timer').textContent = m + ':' + s;
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }

// ── 녹음 모드 탭 ─────────────────────────
function switchRecTab(mode) {
  recMode = mode;
  document.getElementById('recTab-mic').classList.toggle('active', mode === 'mic');
  document.getElementById('recTab-system').classList.toggle('active', mode === 'system');
  const notice = document.getElementById('onlineNotice');
  notice.style.display = mode === 'system' ? 'block' : 'none';
  if (!isRecording) {
    document.getElementById('recordStatus').textContent =
      mode === 'mic' ? '클릭하여 녹음 시작' : '클릭하여 시스템 오디오 녹음 시작';
  }
}

// ── Recording ────────────────────────────
async function toggleRecord() {
  if (isRecording) {
    stopRecording();
  } else if (recMode === 'mic') {
    await startMicRecording();
  } else {
    await startSystemRecording();
  }
}

async function startMicRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const source = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);

    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
      uploadedFile = null;
      document.getElementById('fileInfo').classList.remove('show');
      document.getElementById('fileName').textContent = '';
      // 녹음 저장 버튼 표시
      document.getElementById('saveRecBtn').classList.add('show');
      updateGenerateBtn();
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    isRecording = true;
    document.getElementById('saveRecBtn').classList.remove('show');

    const btn = document.getElementById('recordBtn');
    btn.classList.replace('idle', 'recording');
    document.getElementById('recordStatus').textContent = '녹음 중... 클릭하여 중지';
    document.getElementById('recordStatus').classList.add('recording');
    document.getElementById('timer').classList.remove('hidden');
    waveform.classList.add('active');
    startTimer();
    animateWave();
  } catch (err) {
    showToast('마이크 접근 권한이 필요합니다');
  }
}

function stopRecording() {
  mediaRecorder.stop();
  isRecording = false;
  cancelAnimationFrame(animFrame);
  stopTimer();
  const btn = document.getElementById('recordBtn');
  btn.classList.replace('recording', 'idle');
  document.getElementById('recordStatus').textContent = '녹음 완료 ✓';
  document.getElementById('recordStatus').classList.remove('recording');
  waveform.classList.remove('active');
  bars.forEach(b => b.style.height = '4px');
}

// ── 녹음 파일 저장 ───────────────────────
function saveRecording() {
  if (!recordedBlob) return;
  const now = new Date();
  const ts = now.toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const filename = `회의녹음_${ts}.webm`;
  const url = URL.createObjectURL(recordedBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  showToast('녹음 파일이 저장되었습니다');
}

// ── 시스템 오디오 녹음 ───────────────────
async function startSystemRecording() {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'browser' },
      audio: { echoCancellation: false, noiseSuppression: false, sampleRate: 44100 }
    });

    const audioTracks = stream.getAudioTracks();
    if (audioTracks.length === 0) {
      stream.getTracks().forEach(t => t.stop());
      showToast('❗ 오디오 공유 체크박스를 선택해주세요');
      return;
    }

    const audioStream = new MediaStream(audioTracks);
    audioChunks = [];
    mediaRecorder = new MediaRecorder(audioStream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
      uploadedFile = null;
      document.getElementById('fileInfo').classList.remove('show');
      document.getElementById('saveRecBtn').classList.add('show');
      updateGenerateBtn();
      stream.getTracks().forEach(t => t.stop());
    };

    // 화면 공유 종료 시 자동 중지
    stream.getVideoTracks()[0]?.addEventListener('ended', () => {
      if (isRecording) stopRecording();
    });

    mediaRecorder.start();
    isRecording = true;
    document.getElementById('saveRecBtn').classList.remove('show');

    const btn = document.getElementById('recordBtn');
    btn.classList.replace('idle', 'recording');
    document.getElementById('recordStatus').textContent = '시스템 오디오 녹음 중... 클릭하여 중지';
    document.getElementById('recordStatus').classList.add('recording');
    document.getElementById('timer').classList.remove('hidden');
    waveform.classList.add('active');
    startTimer();

  } catch (err) {
    if (err.name !== 'NotAllowedError') showToast('오류: ' + err.message);
    else showToast('화면 공유가 취소되었습니다');
  }
}

// ── File upload ──────────────────────────
function onDragOver(e) { e.preventDefault(); document.getElementById('uploadArea').classList.add('dragover'); }
function onDragLeave(e) { document.getElementById('uploadArea').classList.remove('dragover'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('uploadArea').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) setFile(file);
}
function onFileSelect(e) { if (e.target.files[0]) setFile(e.target.files[0]); }
function setFile(file) {
  uploadedFile = file;
  recordedBlob = null;
  document.getElementById('saveRecBtn').classList.remove('show');
  document.getElementById('recordStatus').textContent = '클릭하여 녹음 시작';
  document.getElementById('timer').classList.add('hidden');
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileInfo').classList.add('show');
  updateGenerateBtn();
}
function removeFile() {
  uploadedFile = null;
  document.getElementById('fileInfo').classList.remove('show');
  document.getElementById('fileInput').value = '';
  updateGenerateBtn();
}

// ── UI ───────────────────────────────────
function updateGenerateBtn() {
  document.getElementById('generateBtn').disabled = !(recordedBlob || uploadedFile);
}

function setState(state) {
  document.getElementById('emptyState').style.display = state === 'empty' ? 'flex' : 'none';
  document.getElementById('loadingState').style.display = state === 'loading' ? 'flex' : 'none';
  const rp = document.getElementById('resultPanel');
  if (state === 'result') {
    rp.classList.add('show');
    // 모바일: 결과 영역으로 스크롤
    setTimeout(() => rp.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  } else {
    rp.classList.remove('show');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── 탭 전환 ──────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  ['brief', 'medium', 'detail'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  if (lastMinutes) renderResult(lastMinutes);
}

// ── Generate ─────────────────────────────
async function generate() {
  const apiKey = GEMINI_API_KEY;
  const source = recordedBlob || uploadedFile;
  if (!source) return showToast('녹음 또는 파일을 준비해주세요');

  setState('loading');
  document.getElementById('generateBtn').disabled = true;

  try {
    document.getElementById('loadingSub').textContent = '파일 업로드 중...';
    const mimeType = source.type || 'audio/webm';

    const uploadRes = await fetch(
      `https://generativelanguage.googleapis.com/upload/v1beta/files?key=${apiKey}`,
      {
        method: 'POST',
        headers: {
          'X-Goog-Upload-Command': 'start, upload, finalize',
          'X-Goog-Upload-Header-Content-Type': mimeType,
          'Content-Type': mimeType,
        },
        body: source
      }
    );
    if (!uploadRes.ok) {
      const err = await uploadRes.json();
      throw new Error(err.error?.message || '파일 업로드 실패');
    }
    const uploadData = await uploadRes.json();
    const fileUri = uploadData.file?.uri;
    if (!fileUri) throw new Error('파일 URI를 가져오지 못했습니다');

    document.getElementById('loadingSub').textContent = 'Gemini가 회의 내용을 분석 중...';

    const prompt = `당신은 전문 회의록 작성자입니다.
첨부된 회의 녹음을 분석하여 아래 JSON 형식으로만 응답하세요.
마크다운 코드블록, 설명 텍스트 없이 순수 JSON만 출력하세요.

{
  "title": "회의 제목 (내용 기반 자동 생성)",
  "date": "오늘 날짜 YYYY-MM-DD",
  "duration": "회의 시간 (예: 약 30분)",
  "attendees": ["참석자1", "참석자2"],
  "agenda": ["안건1", "안건2"],
  "summary_brief": "핵심만 담은 1~2문장 요약",
  "summary_medium": "주요 내용을 담은 3~5문장 요약",
  "summary_detail": "배경, 맥락, 세부 논의를 포함한 상세 요약 (7~10문장)",
  "discussion": [
    { "topic": "논의 주제", "content_medium": "중간 수준 내용", "content_detail": "발언자 발언, 구체적 수치, 맥락 포함 상세 내용" }
  ],
  "action_items": [
    { "task": "할 일", "owner": "담당자", "due": "기한 또는 빈 문자열" }
  ],
  "decisions": ["결정사항1", "결정사항2"]
}`;

    const genRes = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { file_data: { mime_type: mimeType, file_uri: fileUri } },
              { text: prompt }
            ]
          }],
          generationConfig: { temperature: 0.2, maxOutputTokens: 4096 }
        })
      }
    );
    if (!genRes.ok) {
      const err = await genRes.json();
      throw new Error(err.error?.message || '회의록 생성 실패');
    }

    const genData = await genRes.json();
    let raw = genData.candidates?.[0]?.content?.parts?.[0]?.text || '';
    raw = raw.replace(/```json|```/g, '').trim();

    const minutes = JSON.parse(raw);
    lastMinutes = minutes;
    currentTab = 'medium';
    ['brief','medium','detail'].forEach(t =>
      document.getElementById('tab-'+t).classList.toggle('active', t === 'medium')
    );
    renderResult(minutes);
    setState('result');

  } catch (err) {
    setState('empty');
    showToast('오류: ' + err.message);
    console.error(err);
  } finally {
    document.getElementById('generateBtn').disabled = false;
    updateGenerateBtn();
  }
}

// ── Render ───────────────────────────────
function renderResult(m) {
  document.getElementById('resultTitle').textContent = m.title || '회의록';
  document.getElementById('resultMeta').textContent = [m.date, m.duration].filter(Boolean).join(' · ');

  const body = document.getElementById('resultBody');
  body.innerHTML = '';

  if (currentTab === 'brief') {
    renderBrief(m, body);
  } else if (currentTab === 'medium') {
    renderMedium(m, body);
  } else {
    renderDetail(m, body);
  }
}

function renderBrief(m, body) {
  const card = document.createElement('div');
  card.className = 'brief-card';
  card.innerHTML = `
    <div class="brief-summary">${m.summary_brief || m.summary_medium || ''}</div>
    ${m.attendees?.length ? `
    <div class="brief-row">
      <div class="brief-row-label">참석자</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${m.attendees.map(a => `<span class="chip chip-person">${a}</span>`).join('')}
      </div>
    </div>` : ''}
    ${m.action_items?.length ? `
    <div class="brief-row">
      <div class="brief-row-label">Action Items</div>
      ${m.action_items.map(a => `<div class="brief-item">✓ ${a.task}${a.owner ? ' — ' + a.owner : ''}</div>`).join('')}
    </div>` : ''}
    ${m.decisions?.length ? `
    <div class="brief-row">
      <div class="brief-row-label">결정사항</div>
      ${m.decisions.map(d => `<div class="brief-item">${d}</div>`).join('')}
    </div>` : ''}
  `;
  body.appendChild(card);
}

function renderMedium(m, body) {
  if (m.summary_medium || m.summary_brief) {
    body.appendChild(mkSection('요약', `<div class="summary-text">${m.summary_medium || m.summary_brief}</div>`));
  }
  if (m.attendees?.length) {
    body.appendChild(mkSection('참석자', `<div class="chip-row">${m.attendees.map(a => `<span class="chip chip-person">${a}</span>`).join('')}</div>`));
  }
  if (m.agenda?.length) {
    body.appendChild(mkSection('안건', `<div class="chip-row">${m.agenda.map(a => `<span class="chip chip-agenda">${a}</span>`).join('')}</div>`));
  }
  if (m.discussion?.length) {
    const items = m.discussion.map(d => `
      <div class="discussion-item">
        <div class="discussion-topic">${d.topic}</div>
        <div class="discussion-content">${d.content_medium || d.content_detail || ''}</div>
      </div>`).join('');
    body.appendChild(mkSection('주요 논의', items));
  }
  if (m.action_items?.length) {
    body.appendChild(mkSection('Action Items', renderActionItems(m.action_items)));
  }
  if (m.decisions?.length) {
    body.appendChild(mkSection('결정사항', m.decisions.map(d => `<div class="decision-item"><div class="decision-dot"></div><div>${d}</div></div>`).join('')));
  }
}

function renderDetail(m, body) {
  if (m.summary_detail || m.summary_medium) {
    body.appendChild(mkSection('상세 요약', `<div class="summary-text">${m.summary_detail || m.summary_medium}</div>`));
  }
  if (m.attendees?.length) {
    body.appendChild(mkSection('참석자', `<div class="chip-row">${m.attendees.map(a => `<span class="chip chip-person">${a}</span>`).join('')}</div>`));
  }
  if (m.agenda?.length) {
    body.appendChild(mkSection('안건', `<div class="chip-row">${m.agenda.map(a => `<span class="chip chip-agenda">${a}</span>`).join('')}</div>`));
  }
  if (m.discussion?.length) {
    const items = m.discussion.map(d => `
      <div class="discussion-item">
        <div class="discussion-topic">${d.topic}</div>
        <div class="discussion-content">${d.content_detail || d.content_medium || ''}</div>
      </div>`).join('');
    body.appendChild(mkSection('상세 논의', items));
  }
  if (m.action_items?.length) {
    body.appendChild(mkSection('Action Items', renderActionItems(m.action_items)));
  }
  if (m.decisions?.length) {
    body.appendChild(mkSection('결정사항', m.decisions.map(d => `<div class="decision-item"><div class="decision-dot"></div><div>${d}</div></div>`).join('')));
  }
}

function renderActionItems(items) {
  return items.map(a => `
    <div class="action-item">
      <div class="action-check"></div>
      <div style="flex:1">
        <div class="action-text">${a.task}</div>
        ${a.due ? `<div class="action-due">기한: ${a.due}</div>` : ''}
      </div>
      ${a.owner ? `<span class="action-owner">${a.owner}</span>` : ''}
    </div>`).join('');
}

function mkSection(label, innerHTML) {
  const el = document.createElement('div');
  el.className = 'section';
  el.innerHTML = `<div class="section-label">${label}</div>${innerHTML}`;
  return el;
}

// ── Copy markdown ─────────────────────────
function copyMarkdown() {
  if (!lastMinutes) return;
  const m = lastMinutes;
  const summary = currentTab === 'brief' ? m.summary_brief :
                  currentTab === 'detail' ? m.summary_detail : m.summary_medium;
  let md = `# ${m.title || '회의록'}\n`;
  if (m.date) md += `\n**날짜:** ${m.date}`;
  if (m.duration) md += ` · ${m.duration}`;
  if (m.attendees?.length) md += `\n\n## 참석자\n${m.attendees.map(a => `- ${a}`).join('\n')}`;
  if (m.agenda?.length) md += `\n\n## 안건\n${m.agenda.map(a => `- ${a}`).join('\n')}`;
  if (summary) md += `\n\n## 요약\n${summary}`;
  if (m.discussion?.length) {
    md += `\n\n## 논의`;
    m.discussion.forEach(d => {
      const content = currentTab === 'detail' ? d.content_detail : d.content_medium;
      md += `\n\n### ${d.topic}\n${content || ''}`;
    });
  }
  if (m.action_items?.length) {
    md += `\n\n## Action Items`;
    m.action_items.forEach(a => {
      md += `\n- [ ] ${a.task}`;
      if (a.owner) md += ` — ${a.owner}`;
      if (a.due) md += ` (기한: ${a.due})`;
    });
  }
  if (m.decisions?.length) {
    md += `\n\n## 결정사항\n${m.decisions.map(d => `- ${d}`).join('\n')}`;
  }
  navigator.clipboard.writeText(md).then(() => showToast('마크다운이 복사되었습니다'));
}

setState('empty');
</script>
