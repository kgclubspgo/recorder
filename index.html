<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록 자동 생성</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --bg2: #18181c;
    --bg3: #222228;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.15);
    --text: #f0eff5;
    --text2: #9896a4;
    --text3: #5c5b66;
    --accent: #6c63ff;
    --accent-dim: rgba(108,99,255,0.15);
    --accent-glow: rgba(108,99,255,0.3);
    --red: #ff4f4f;
    --red-dim: rgba(255,79,79,0.12);
    --green: #3ddc97;
    --green-dim: rgba(61,220,151,0.12);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.12);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .header h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .header-sub {
    margin-left: auto;
    font-size: 12px;
    color: var(--text3);
  }

  /* Main layout */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 400px 1fr;
    height: calc(100vh - 61px);
  }

  /* Left panel */
  .left {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 32px 28px;
    gap: 28px;
    overflow-y: auto;
  }

  /* API Key input */
  .save-key-btn {
    padding: 0 16px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .save-key-btn:hover { background: #7b74ff; }
  .save-key-btn.saved {
    background: var(--green-dim);
    border: 1px solid rgba(61,220,151,0.3);
    color: var(--green);
    cursor: default;
  }
  .key-saved {
    display: none;
    font-size: 11px;
    color: var(--green);
    margin-top: 4px;
  }
  .key-saved.show { display: block; }
  .api-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .input-wrap {
    position: relative;
  }
  .api-input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .api-input:focus { border-color: var(--accent); }
  .api-input::placeholder { color: var(--text3); font-family: inherit; }

  /* Recorder */
  .recorder-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .record-btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .record-btn {
    width: 88px; height: 88px;
    border-radius: 50%;
    border: none;
    background: var(--bg2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
    outline: none;
  }
  .record-btn::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    transition: border-color 0.2s;
  }
  .record-btn:hover::before { border-color: var(--border-hover); }

  .record-btn.idle { border: 1.5px solid var(--border); }
  .record-btn.idle:hover { background: var(--bg3); }

  .record-btn.recording {
    background: var(--red-dim);
    border: 1.5px solid var(--red);
    animation: pulse-ring 1.5s ease-in-out infinite;
  }
  .record-btn.recording::before { border-color: rgba(255,79,79,0.3); }

  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,79,79,0.2); }
    50% { box-shadow: 0 0 0 12px rgba(255,79,79,0); }
  }

  .record-icon {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--red);
    transition: all 0.2s;
  }
  .record-btn.recording .record-icon {
    border-radius: 4px;
    width: 18px; height: 18px;
  }

  .record-status {
    font-size: 13px;
    color: var(--text2);
    text-align: center;
  }
  .record-status.recording { color: var(--red); }

  .timer {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-family: 'SF Mono', monospace;
  }
  .timer.hidden { display: none; }

  /* Waveform */
  .waveform {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .waveform.active { opacity: 1; }
  .wave-bar {
    width: 3px;
    border-radius: 2px;
    background: var(--red);
    height: 4px;
    transition: height 0.1s ease;
  }

  /* Upload area */
  .divider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text3);
    font-size: 12px;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .upload-area {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
  }
  .upload-area:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .upload-area.dragover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .upload-area input { display: none; }
  .upload-icon {
    font-size: 20px;
    margin-bottom: 6px;
    opacity: 0.5;
  }
  .upload-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
  }
  .upload-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
  }

  /* File info */
  .file-info {
    display: none;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text2);
    gap: 8px;
    align-items: center;
  }
  .file-info.show { display: flex; }
  .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .file-remove {
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: 16px; line-height: 1;
    padding: 0; transition: color 0.2s;
  }
  .file-remove:hover { color: var(--red); }

  /* Generate button */
  .generate-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: -0.01em;
  }
  .generate-btn:hover { background: #7b74ff; }
  .generate-btn:disabled {
    background: var(--bg3);
    color: var(--text3);
    cursor: not-allowed;
  }

  /* Right panel */
  .right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text3);
  }
  .empty-icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: var(--bg2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 4px;
  }
  .empty-state h2 { font-size: 15px; font-weight: 500; color: var(--text2); }
  .empty-state p { font-size: 13px; text-align: center; line-height: 1.6; max-width: 240px; }

  /* Loading state */
  .loading-state {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .loading-state.show { display: flex; }
  .loading-ring {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--text2); }
  .loading-sub { font-size: 12px; color: var(--text3); }

  /* Result panel */
  .result-panel {
    display: none;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }
  .result-panel.show { display: flex; }

  .result-header {
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .result-title-wrap { flex: 1; }
  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--green-dim);
    border: 1px solid rgba(61,220,151,0.2);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    color: var(--green);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .result-badge-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--green);
  }
  .result-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.3;
  }
  .result-meta {
    font-size: 12px;
    color: var(--text3);
    margin-top: 4px;
  }
  .copy-btn {
    padding: 8px 14px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--border-hover); color: var(--text); }

  .result-body {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Sections */
  .section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Summary */
  .summary-text {
    font-size: 14px;
    line-height: 1.75;
    color: var(--text2);
    background: var(--bg2);
    border-left: 2px solid var(--accent);
    padding: 14px 16px;
    border-radius: 0 8px 8px 0;
  }

  /* Chips */
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid;
  }
  .chip-person {
    background: var(--accent-dim);
    border-color: rgba(108,99,255,0.25);
    color: #a09bff;
  }
  .chip-agenda {
    background: var(--amber-dim);
    border-color: rgba(245,166,35,0.25);
    color: var(--amber);
  }

  /* Discussion items */
  .discussion-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.2s;
  }
  .discussion-item:hover { border-color: var(--border-hover); }
  .discussion-topic {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .discussion-content {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.65;
  }

  /* Action items */
  .action-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: border-color 0.2s;
  }
  .action-item:hover { border-color: var(--border-hover); }
  .action-check {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: 1.5px solid var(--border-hover);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .action-text {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
  }
  .action-owner {
    font-size: 11px;
    background: var(--accent-dim);
    color: #a09bff;
    border: 1px solid rgba(108,99,255,0.2);
    border-radius: 4px;
    padding: 2px 7px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .action-due {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
  }

  /* Decisions */
  .decision-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
    padding: 10px 14px;
    background: var(--green-dim);
    border: 1px solid rgba(61,220,151,0.15);
    border-radius: 8px;
  }
  .decision-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
    margin-top: 5px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-dot"></div>
  <h1>회의록 자동 생성</h1>
  <span class="header-sub">Gemini 2.5 Flash</span>
</div>

<div class="main">
  <!-- Left Panel -->
  <div class="left">

    <!-- API Key -->
    <div class="api-section">
      <span class="label">Gemini API Key</span>
      <div style="display:flex;gap:8px;">
        <input type="password" class="api-input" id="apiKey" placeholder="AIza..." style="flex:1;">
        <button class="save-key-btn" id="saveKeyBtn" onclick="saveApiKey()">적용</button>
      </div>
      <div class="key-saved" id="keySaved">✓ 적용됨</div>
    </div>

    <!-- Recorder -->
    <div class="recorder-section">
      <span class="label">녹음</span>
      <div class="record-btn-wrap">
        <div class="timer hidden" id="timer">00:00</div>
        <button class="record-btn idle" id="recordBtn" onclick="toggleRecord()">
          <div class="record-icon"></div>
        </button>
        <span class="record-status" id="recordStatus">클릭하여 녹음 시작</span>
      </div>
      <div class="waveform" id="waveform">
        <!-- bars injected by JS -->
      </div>
    </div>

    <!-- Divider -->
    <div class="divider-row">
      <div class="divider-line"></div>
      <span>또는</span>
      <div class="divider-line"></div>
    </div>

    <!-- Upload -->
    <div>
      <span class="label" style="display:block;margin-bottom:8px;">파일 업로드</span>
      <div class="upload-area" id="uploadArea"
        onclick="document.getElementById('fileInput').click()"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event)">
        <input type="file" id="fileInput" accept="audio/*,video/*" onchange="onFileSelect(event)">
        <div class="upload-icon">🎙</div>
        <div class="upload-text">파일을 드래그하거나 클릭하여 선택</div>
        <div class="upload-sub">.m4a .mp3 .wav .mp4 지원</div>
      </div>
      <div class="file-info" id="fileInfo">
        <span>🎵</span>
        <span class="file-name" id="fileName"></span>
        <button class="file-remove" onclick="removeFile()">✕</button>
      </div>
    </div>

    <!-- Generate -->
    <button class="generate-btn" id="generateBtn" onclick="generate()" disabled>
      회의록 생성
    </button>

  </div>

  <!-- Right Panel -->
  <div class="right">

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📋</div>
      <h2>회의록이 여기에 표시됩니다</h2>
      <p>녹음하거나 파일을 업로드한 후<br>회의록 생성을 눌러주세요</p>
    </div>

    <!-- Loading state -->
    <div class="loading-state" id="loadingState">
      <div class="loading-ring"></div>
      <div class="loading-text">Gemini가 분석 중입니다</div>
      <div class="loading-sub" id="loadingSub">오디오 변환 중...</div>
    </div>

    <!-- Result panel -->
    <div class="result-panel" id="resultPanel">
      <div class="result-header">
        <div class="result-title-wrap">
          <div class="result-badge">
            <div class="result-badge-dot"></div>
            생성 완료
          </div>
          <div class="result-title" id="resultTitle">회의록</div>
          <div class="result-meta" id="resultMeta"></div>
        </div>
        <button class="copy-btn" onclick="copyMarkdown()">마크다운 복사</button>
      </div>
      <div class="result-body" id="resultBody"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let timerInterval = null;
let seconds = 0;
let recordedBlob = null;
let uploadedFile = null;
let animFrame = null;
let analyser = null;
let dataArray = null;
let lastMinutes = null;

// ── Waveform setup ───────────────────────────────────
const waveform = document.getElementById('waveform');
const BAR_COUNT = 32;
for (let i = 0; i < BAR_COUNT; i++) {
  const bar = document.createElement('div');
  bar.className = 'wave-bar';
  waveform.appendChild(bar);
}
const bars = waveform.querySelectorAll('.wave-bar');

function animateWave() {
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  const step = Math.floor(dataArray.length / BAR_COUNT);
  bars.forEach((bar, i) => {
    const val = dataArray[i * step] || 0;
    const h = Math.max(4, (val / 255) * 44);
    bar.style.height = h + 'px';
  });
  animFrame = requestAnimationFrame(animateWave);
}

// ── Timer ────────────────────────────────────────────
function startTimer() {
  seconds = 0;
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    document.getElementById('timer').textContent = m + ':' + s;
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
}

// ── Recording ────────────────────────────────────────
async function toggleRecord() {
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    // Analyser for waveform
    const ctx = new AudioContext();
    const source = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);

    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
      uploadedFile = null;
      document.getElementById('fileInfo').classList.remove('show');
      document.getElementById('fileName').textContent = '';
      updateGenerateBtn();
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    isRecording = true;

    // UI
    const btn = document.getElementById('recordBtn');
    btn.classList.remove('idle');
    btn.classList.add('recording');
    document.getElementById('recordStatus').textContent = '녹음 중... 클릭하여 중지';
    document.getElementById('recordStatus').classList.add('recording');
    document.getElementById('timer').classList.remove('hidden');
    waveform.classList.add('active');
    startTimer();
    animateWave();

  } catch (err) {
    showToast('마이크 접근 권한이 필요합니다');
  }
}

function stopRecording() {
  mediaRecorder.stop();
  isRecording = false;

  cancelAnimationFrame(animFrame);
  stopTimer();

  const btn = document.getElementById('recordBtn');
  btn.classList.remove('recording');
  btn.classList.add('idle');
  document.getElementById('recordStatus').textContent = '녹음 완료 ✓';
  document.getElementById('recordStatus').classList.remove('recording');
  waveform.classList.remove('active');
  bars.forEach(b => b.style.height = '4px');
}

// ── File upload ──────────────────────────────────────
function onDragOver(e) {
  e.preventDefault();
  document.getElementById('uploadArea').classList.add('dragover');
}
function onDragLeave(e) {
  document.getElementById('uploadArea').classList.remove('dragover');
}
function onDrop(e) {
  e.preventDefault();
  document.getElementById('uploadArea').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) setFile(file);
}
function onFileSelect(e) {
  const file = e.target.files[0];
  if (file) setFile(file);
}
function setFile(file) {
  uploadedFile = file;
  recordedBlob = null;
  document.getElementById('recordStatus').textContent = '클릭하여 녹음 시작';
  document.getElementById('timer').classList.add('hidden');
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileInfo').classList.add('show');
  updateGenerateBtn();
}
function removeFile() {
  uploadedFile = null;
  document.getElementById('fileInfo').classList.remove('show');
  document.getElementById('fileInput').value = '';
  updateGenerateBtn();
}

// ── UI helpers ───────────────────────────────────────
function saveApiKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) return showToast('API 키를 입력해주세요');
  const btn = document.getElementById('saveKeyBtn');
  const saved = document.getElementById('keySaved');
  btn.textContent = '✓ 적용됨';
  btn.classList.add('saved');
  btn.disabled = true;
  saved.classList.add('show');
  updateGenerateBtn();
  setTimeout(() => {
    btn.textContent = '적용';
    btn.classList.remove('saved');
    btn.disabled = false;
  }, 3000);
}

function updateGenerateBtn() {
  const hasSource = recordedBlob || uploadedFile;
  const hasKey = document.getElementById('apiKey').value.trim();
  document.getElementById('generateBtn').disabled = !(hasSource && hasKey);
}
document.getElementById('apiKey').addEventListener('input', updateGenerateBtn);

function setState(state) {
  document.getElementById('emptyState').style.display = state === 'empty' ? 'flex' : 'none';
  document.getElementById('loadingState').style.display = state === 'loading' ? 'flex' : 'none';
  document.getElementById('resultPanel').style.display = state === 'result' ? 'flex' : 'none';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Generate ─────────────────────────────────────────
async function generate() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) return showToast('API 키를 입력해주세요');

  const source = recordedBlob || uploadedFile;
  if (!source) return showToast('녹음 또는 파일을 준비해주세요');

  setState('loading');
  document.getElementById('generateBtn').disabled = true;

  try {
    // 1. Upload file to Gemini Files API
    document.getElementById('loadingSub').textContent = '파일 업로드 중...';
    const mimeType = source.type || 'audio/webm';
    const uploadRes = await fetch(
      `https://generativelanguage.googleapis.com/upload/v1beta/files?key=${apiKey}`,
      {
        method: 'POST',
        headers: {
          'X-Goog-Upload-Command': 'start, upload, finalize',
          'X-Goog-Upload-Header-Content-Type': mimeType,
          'Content-Type': mimeType,
        },
        body: source
      }
    );

    if (!uploadRes.ok) {
      const err = await uploadRes.json();
      throw new Error(err.error?.message || '파일 업로드 실패');
    }

    const uploadData = await uploadRes.json();
    const fileUri = uploadData.file?.uri;
    if (!fileUri) throw new Error('파일 URI를 가져오지 못했습니다');

    // 2. Generate meeting minutes
    document.getElementById('loadingSub').textContent = 'Gemini가 회의 내용을 분석 중...';

    const prompt = `당신은 전문 회의록 작성자입니다.
첨부된 회의 녹음을 분석하여 아래 JSON 형식으로만 응답하세요.
마크다운 코드블록, 설명 텍스트 없이 순수 JSON만 출력하세요.

{
  "title": "회의 제목 (내용 기반 자동 생성)",
  "date": "오늘 날짜 YYYY-MM-DD",
  "duration": "회의 시간 (예: 약 30분)",
  "attendees": ["참석자1", "참석자2"],
  "agenda": ["안건1", "안건2"],
  "summary": "전체 회의 요약 3~5문장",
  "discussion": [
    { "topic": "논의 주제", "content": "세부 내용" }
  ],
  "action_items": [
    { "task": "할 일", "owner": "담당자", "due": "기한 또는 빈 문자열" }
  ],
  "decisions": ["결정사항1", "결정사항2"]
}`;

    const genRes = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { file_data: { mime_type: mimeType, file_uri: fileUri } },
              { text: prompt }
            ]
          }],
          generationConfig: { temperature: 0.2, maxOutputTokens: 4096 }
        })
      }
    );

    if (!genRes.ok) {
      const err = await genRes.json();
      throw new Error(err.error?.message || '회의록 생성 실패');
    }

    const genData = await genRes.json();
    let raw = genData.candidates?.[0]?.content?.parts?.[0]?.text || '';
    raw = raw.replace(/```json|```/g, '').trim();

    const minutes = JSON.parse(raw);
    lastMinutes = minutes;
    renderResult(minutes);
    setState('result');

  } catch (err) {
    setState('empty');
    showToast('오류: ' + err.message);
    console.error(err);
  } finally {
    document.getElementById('generateBtn').disabled = false;
    updateGenerateBtn();
  }
}

// ── Render ───────────────────────────────────────────
function renderResult(m) {
  document.getElementById('resultTitle').textContent = m.title || '회의록';
  document.getElementById('resultMeta').textContent =
    [m.date, m.duration].filter(Boolean).join(' · ');

  const body = document.getElementById('resultBody');
  body.innerHTML = '';

  // Summary
  if (m.summary) {
    body.appendChild(section('요약', `<div class="summary-text">${m.summary}</div>`));
  }

  // Attendees
  if (m.attendees?.length) {
    const chips = m.attendees.map(a => `<span class="chip chip-person">${a}</span>`).join('');
    body.appendChild(section('참석자', `<div class="chip-row">${chips}</div>`));
  }

  // Agenda
  if (m.agenda?.length) {
    const chips = m.agenda.map(a => `<span class="chip chip-agenda">${a}</span>`).join('');
    body.appendChild(section('안건', `<div class="chip-row">${chips}</div>`));
  }

  // Discussion
  if (m.discussion?.length) {
    const items = m.discussion.map(d => `
      <div class="discussion-item">
        <div class="discussion-topic">${d.topic}</div>
        <div class="discussion-content">${d.content}</div>
      </div>`).join('');
    body.appendChild(section('주요 논의', items));
  }

  // Action Items
  if (m.action_items?.length) {
    const items = m.action_items.map(a => `
      <div class="action-item">
        <div class="action-check"></div>
        <div style="flex:1">
          <div class="action-text">${a.task}</div>
          ${a.due ? `<div class="action-due">기한: ${a.due}</div>` : ''}
        </div>
        ${a.owner ? `<span class="action-owner">${a.owner}</span>` : ''}
      </div>`).join('');
    body.appendChild(section('Action Items', items));
  }

  // Decisions
  if (m.decisions?.length) {
    const items = m.decisions.map(d => `
      <div class="decision-item">
        <div class="decision-dot"></div>
        <div>${d}</div>
      </div>`).join('');
    body.appendChild(section('결정사항', items));
  }
}

function section(label, innerHTML) {
  const el = document.createElement('div');
  el.className = 'section';
  el.innerHTML = `<div class="section-label">${label}</div>${innerHTML}`;
  return el;
}

// ── Copy markdown ────────────────────────────────────
function copyMarkdown() {
  if (!lastMinutes) return;
  const m = lastMinutes;
  let md = `# ${m.title || '회의록'}\n`;
  if (m.date) md += `\n**날짜:** ${m.date}`;
  if (m.duration) md += ` · ${m.duration}`;
  if (m.attendees?.length) md += `\n\n## 참석자\n${m.attendees.map(a => `- ${a}`).join('\n')}`;
  if (m.agenda?.length) md += `\n\n## 안건\n${m.agenda.map(a => `- ${a}`).join('\n')}`;
  if (m.summary) md += `\n\n## 요약\n${m.summary}`;
  if (m.discussion?.length) {
    md += `\n\n## 주요 논의`;
    m.discussion.forEach(d => { md += `\n\n### ${d.topic}\n${d.content}`; });
  }
  if (m.action_items?.length) {
    md += `\n\n## Action Items`;
    m.action_items.forEach(a => {
      md += `\n- [ ] ${a.task}`;
      if (a.owner) md += ` — ${a.owner}`;
      if (a.due) md += ` (기한: ${a.due})`;
    });
  }
  if (m.decisions?.length) {
    md += `\n\n## 결정사항\n${m.decisions.map(d => `- ${d}`).join('\n')}`;
  }
  navigator.clipboard.writeText(md).then(() => showToast('마크다운이 복사되었습니다'));
}

// Init
setState('empty');
</script>
